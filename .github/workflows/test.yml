name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits, not tags: a moved tag cannot change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI has no Herdr to write this file: it takes the repository's copy
      - run: cp vendor/herdr/gpui-kit.d.ts mods/linear-panel/
      - run: pnpm lint
      - run: pnpm run typecheck
      # The stand-in for Herdr refuses the element methods this file does not list
      - run: pnpm test
        env:
          HERDR_APP_HOME: ${{ github.workspace }}/vendor/herdr
